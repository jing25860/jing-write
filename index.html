<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3b82f6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="application-name" content="静 · 写字">
<meta name="format-detection" content="telephone=no">
<link id="app-manifest" rel="manifest">
<title>静 · 写字</title>
<style>
  /* ===== THEME VARIABLES ===== */
  :root { --safe-bottom: env(safe-area-inset-bottom, 0px); }
  [data-theme="light"] {
    --bg: #f4f6f9; --bg-card: #ffffff; --bg-sidebar: #ffffff;
    --bg-hover: #f1f5f9; --bg-active: #eff6ff; --bg-outline: #f1f5f9;
    --bg-modal: #ffffff; --bg-overlay: rgba(0,0,0,0.3);
    --border: #e2e8f0; --border-focus: #3b82f6; --border-dash: #cbd5e1;
    --text-primary: #1a202c; --text-secondary: #475569; --text-muted: #94a3b8; --text-placeholder: #cbd5e1;
    --accent: #3b82f6; --accent-hover: #2563eb; --accent-bg: #eff6ff;
    --warn: #ef4444; --warn-bg: #fef2f2; --warn-border: #fecaca;
    --badge-event-bg: #dbeafe; --badge-event-text: #2563eb;
    --badge-full-bg: #fef3c7; --badge-full-text: #d97706;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.04); --shadow-md: 0 2px 8px rgba(0,0,0,0.06); --shadow-lg: 0 20px 60px rgba(0,0,0,0.1);
  }
  [data-theme="dark"] {
    --bg: #0f172a; --bg-card: #1e293b; --bg-sidebar: #1e293b;
    --bg-hover: #334155; --bg-active: #1e3a5f; --bg-outline: #1e293b;
    --bg-modal: #1e293b; --bg-overlay: rgba(0,0,0,0.6);
    --border: #334155; --border-focus: #60a5fa; --border-dash: #475569;
    --text-primary: #f1f5f9; --text-secondary: #cbd5e1; --text-muted: #64748b; --text-placeholder: #475569;
    --accent: #60a5fa; --accent-hover: #93bbfd; --accent-bg: #1e3a5f;
    --warn: #f87171; --warn-bg: #3b1a1a; --warn-border: #7f1d1d;
    --badge-event-bg: #1e3a5f; --badge-event-text: #93c5fd;
    --badge-full-bg: #422006; --badge-full-text: #fcd34d;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.3); --shadow-md: 0 2px 8px rgba(0,0,0,0.4); --shadow-lg: 0 20px 60px rgba(0,0,0,0.5);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", -apple-system, sans-serif;
    background: var(--bg); color: var(--text-primary);
    height: 100vh; height: 100dvh; overflow: hidden;
    overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent;
    transition: background 0.3s, color 0.3s;
  }
  input, textarea, select, .content-editable { transition: background 0.3s, color 0.3s, border-color 0.3s; }

  /* ===== TOP NAV ===== */
  .top-nav {
    display: flex; align-items: center; height: 50px;
    background: var(--bg-card); border-bottom: 1px solid var(--border);
    padding: 0 20px; box-shadow: var(--shadow-sm);
    transition: background 0.3s, border-color 0.3s;
  }
  .logo { font-size: 17px; font-weight: 700; color: var(--accent); margin-right: 28px; letter-spacing: 0.04em; }
  .tab-btn {
    border: none; background: none; font: inherit; font-size: 13px;
    color: var(--text-muted); padding: 13px 18px; cursor: pointer;
    border-bottom: 2px solid transparent; transition: all 0.15s; letter-spacing: 0.02em;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .tab-btn:hover { color: var(--accent); }
  .theme-toggle {
    margin-left: auto; border: 1px solid var(--border); background: var(--bg-card);
    font-size: 13px; color: var(--text-muted); padding: 6px 14px; border-radius: 20px;
    cursor: pointer; transition: all 0.2s; font-family: inherit;
    display: flex; align-items: center; gap: 6px;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .theme-toggle .toggle-icon { font-size: 15px; }

  /* ===== MAIN ===== */
  .main-wrap { display: flex; height: calc(100vh - 50px); height: calc(100dvh - 50px); }
  .panel { display: none; width: 100%; height: 100%; }
  .panel.active { display: flex; }

  /* ===== SIDEBAR ===== */
  .sidebar {
    width: 230px; min-width: 230px; background: var(--bg-sidebar);
    border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto;
    transition: background 0.3s, border-color 0.3s;
  }
  .sidebar-header {
    padding: 16px 14px 10px; font-size: 11px; font-weight: 700;
    color: var(--text-muted); letter-spacing: 0.08em;
    display: flex; justify-content: space-between; align-items: center;
  }
  .sidebar-footer { padding: 10px; margin-top: auto; }
  .tag-list { padding: 0 8px 8px; }
  .tag-item {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    border-radius: 6px; cursor: pointer; font-size: 13px;
    transition: all 0.12s; margin-bottom: 1px;
  }
  .tag-item:hover { background: var(--bg-hover); }
  .tag-item.selected { background: var(--bg-active); color: var(--accent); font-weight: 600; }
  .tag-item.all-tags { font-weight: 600; margin-bottom: 8px; border-bottom: 1px solid var(--border); padding-bottom: 12px; border-radius: 0; }
  .tag-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .tag-count { margin-left: auto; font-size: 11px; color: var(--text-muted); }

  .btn-sm {
    width: 100%; border: 1px dashed var(--border-dash); background: none;
    font: inherit; font-size: 12px; color: var(--text-muted); padding: 8px;
    border-radius: 6px; cursor: pointer; transition: all 0.12s;
  }
  .btn-sm:hover { border-color: var(--accent); color: var(--accent); }
  .btn {
    border: 1px solid var(--border); background: var(--bg-card); font: inherit;
    font-size: 13px; color: var(--text-secondary); padding: 7px 14px; border-radius: 6px;
    cursor: pointer; transition: all 0.12s; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.warn { color: var(--warn); border-color: var(--warn-border); }
  .btn.warn:hover { background: var(--warn-bg); }

  /* ===== CONTENT ===== */
  .content-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); transition: background 0.3s; }
  .content-toolbar {
    display: flex; align-items: center; gap: 10px; padding: 10px 18px;
    background: var(--bg-card); border-bottom: 1px solid var(--border); flex-shrink: 0;
    flex-wrap: wrap; transition: background 0.3s, border-color 0.3s;
  }
  .section-title { font-size: 14px; font-weight: 700; color: var(--text-primary); }
  .content-toolbar select {
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px;
    font: inherit; font-size: 13px; color: var(--text-secondary); background: var(--bg-card);
    outline: none; cursor: pointer; transition: all 0.12s;
  }
  .content-toolbar select:focus { border-color: var(--accent); }
  .spacer { flex: 1; }

  /* ===== CARDS ===== */
  .card-grid {
    flex: 1; overflow-y: auto; padding: 14px 18px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 12px; align-content: start;
  }
  .material-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px; cursor: pointer; transition: all 0.15s;
    display: flex; flex-direction: column; gap: 8px; position: relative;
  }
  .material-card:hover { border-color: var(--accent); box-shadow: var(--shadow-md); }
  .material-card:active { background: var(--bg-hover); }
  .card-type {
    font-size: 11px; font-weight: 600; display: inline-block;
    padding: 3px 10px; border-radius: 4px; width: fit-content; letter-spacing: 0.03em;
  }
  .card-type.event { background: var(--badge-event-bg); color: var(--badge-event-text); }
  .card-type.full { background: var(--badge-full-bg); color: var(--badge-full-text); }
  .card-type.hook { background: #d1fae5; color: #059669; }
  .card-type.chapter { background: #ede9fe; color: #7c3aed; }
  .card-title { font-size: 15px; font-weight: 700; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-body { font-size: 13px; color: var(--text-secondary); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card-hover-preview {
    display: none; position: absolute; top: 100%; left: 0; right: 0; z-index: 50;
    background: var(--bg-card); border: 1px solid var(--accent); border-radius: 8px;
    padding: 14px; max-height: 300px; overflow-y: auto; box-shadow: var(--shadow-lg);
    font-size: 13px; line-height: 1.75; color: var(--text-primary); white-space: pre-wrap;
  }
  .material-card:hover .card-hover-preview { display: block; }
  .card-tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .mini-tag { font-size: 10px; padding: 2px 8px; border-radius: 3px; color: #fff; letter-spacing: 0.02em; }
  .card-meta { font-size: 11px; color: var(--text-muted); display: flex; gap: 12px; margin-top: auto; flex-wrap: wrap; }
  .empty-state {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100%; color: var(--text-muted); gap: 10px; padding: 20px;
  }
  .empty-state .e-icon { font-size: 40px; opacity: 0.25; }
  .empty-state p { font-size: 14px; text-align: center; }

  /* ===== WRITING ===== */
  .writing-layout { display: flex; flex: 1; overflow: hidden; }
  .chapter-list-sidebar {
    width: 160px; min-width: 160px; background: var(--bg-sidebar); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow-y: auto; padding: 0 8px;
    transition: background 0.3s, border-color 0.3s;
  }
  .chapter-list-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 4px 10px; font-size: 11px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.08em;
  }
  .chapter-item {
    display: flex; align-items: center; gap: 4px; padding: 6px 8px;
    border-radius: 6px; cursor: pointer; font-size: 12px; color: var(--text-secondary);
    transition: all 0.12s; margin-bottom: 1px; user-select: none;
  }
  .chapter-item:hover { background: var(--bg-hover); }
  .chapter-item.active { background: var(--bg-active); color: var(--accent); font-weight: 600; }
  .chapter-index { font-size: 11px; color: var(--text-muted); min-width: 20px; }
  .chapter-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drag-handle { cursor: grab; color: var(--text-muted); font-size: 12px; }
  .chapter-item.dragging { opacity: 0.5; }
  .chapter-item.drag-over { border-top: 2px solid var(--accent); }
  .chapter-add-btn {
    border: 1px dashed var(--border-dash); background: none; font: inherit;
    font-size: 12px; color: var(--text-muted); padding: 8px; border-radius: 6px;
    cursor: pointer; width: 100%; margin-top: 4px; margin-bottom: 10px; transition: all 0.12s;
  }
  .chapter-add-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ===== EDITOR CONTAINER ===== */
  .editor-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* ===== OUTLINE (always at top of editor, collapsible) ===== */
  /* ===== 大纲：三态模式 ===== */
  .outline-area {
    background: var(--bg-outline); border-bottom: 2px solid var(--border);
    flex-shrink: 0; transition: background 0.3s, border-color 0.3s;
    position: relative; z-index: 10;
  }
  .outline-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 18px; cursor: pointer; user-select: none;
    font-size: 12px; font-weight: 700; color: var(--text-secondary); letter-spacing: 0.04em;
    transition: background 0.12s;
  }
  .outline-bar:hover { background: var(--bg-hover); }
  .outline-bar .outline-arrow { font-size: 10px; transition: transform 0.2s; color: var(--text-muted); }

  /* 中等展开：在编辑器上方，可滑动看旧大纲内容 */
  .outline-mid {
    display: none; flex-direction: column; max-height: 200px; overflow-y: auto;
    border-top: 1px solid var(--border); background: var(--bg-card);
  }
  .outline-mid.open { display: flex; }
  .outline-mid-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 18px; background: var(--bg-outline); flex-shrink: 0;
    font-size: 11px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.04em;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 1;
  }
  .outline-mid-body {
    flex: 1; display: flex; overflow: hidden; min-height: 0;
  }

  /* 全展开：覆盖整个屏幕 */
  .outline-full {
    display: none; position: fixed; inset: 0; z-index: 300;
    background: var(--bg-card); flex-direction: column; overflow: hidden;
  }
  .outline-full.open { display: flex; }
  .outline-full-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    font-size: 14px; font-weight: 700; color: var(--text-primary);
    background: var(--bg-card);
  }
  .outline-full-body {
    flex: 1; display: flex; overflow: hidden;
  }
  .outline-pane {
    flex: 1; display: flex; flex-direction: column; overflow: hidden;
    border-right: 1px solid var(--border);
  }
  .outline-pane:last-child { border-right: none; }
  .outline-pane-header {
    padding: 10px 18px; font-size: 13px; font-weight: 700; color: var(--text-secondary);
    letter-spacing: 0.04em; border-bottom: 1px solid var(--border); flex-shrink: 0;
    background: var(--bg-outline);
  }
  .outline-pane textarea {
    flex: 1; width: 100%; border: none; padding: 16px 20px;
    font: inherit; font-size: 14px; line-height: 1.85; color: var(--text-primary);
    background: var(--bg-card); outline: none; resize: none;
    transition: background 0.3s, color 0.3s;
  }
  .outline-pane textarea:focus { background: var(--bg-hover); }

  /* 箭头旋转指示 */
  .outline-area.state-mid .outline-arrow { transform: rotate(90deg); }
  .outline-area.state-full .outline-arrow { transform: rotate(180deg); }

  /* ===== 全展开遮罩 ===== */
  .outline-backdrop {
    display: none; position: fixed; inset: 0; z-index: 299;
    background: rgba(0,0,0,0.3);
  }
  .outline-backdrop.open { display: block; }

  /* ===== EDITOR TOOLBAR ===== */
  .editor-toolbar {
    display: flex; align-items: center; gap: 2px; padding: 6px 14px;
    background: var(--bg-card); border-bottom: 1px solid var(--border); flex-wrap: wrap; flex-shrink: 0;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    transition: background 0.3s, border-color 0.3s;
  }
  .editor-toolbar .sep { width: 1px; height: 18px; background: var(--border); margin: 0 4px; flex-shrink: 0; }
  .tool-btn {
    border: 1px solid transparent; background: none; font-size: 13px;
    color: var(--text-secondary); padding: 5px 9px; border-radius: 4px; cursor: pointer;
    min-width: 30px; text-align: center; transition: all 0.1s; font-family: inherit; flex-shrink: 0;
  }
  .tool-btn:hover { background: var(--bg-hover); border-color: var(--border); }
  .tool-btn.active { background: var(--bg-active); color: var(--accent); border-color: var(--border-focus); }
  .tool-btn select { border: none; background: none; font: inherit; font-size: 12px; color: inherit; cursor: pointer; outline: none; }
  .tool-btn .color-input { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
  .tool-btn.color-wrap { position: relative; }

  .chapter-title-bar {
    display: flex; align-items: center; gap: 10px; padding: 10px 18px;
    background: var(--bg-card); border-bottom: 1px solid var(--border); flex-shrink: 0;
    transition: background 0.3s, border-color 0.3s;
  }
  .chapter-title-bar input {
    flex: 1; border: none; font: inherit; font-size: 19px; font-weight: 700;
    color: var(--text-primary); outline: none; background: transparent; min-width: 0;
  }
  .chapter-title-bar input::placeholder { color: var(--text-placeholder); }
  .chapter-meta { display: flex; gap: 10px; font-size: 12px; color: var(--text-muted); white-space: nowrap; flex-shrink: 0; }

  /* ===== CHAPTER EDITOR WRAP (material panel + editor main) ===== */
  .chapter-editor-wrap { flex: 1; display: flex; overflow: hidden; }

  /* ===== MATERIAL PANEL (left side, slide in/out) ===== */
  .material-panel {
    width: 0; min-width: 0; background: var(--bg-sidebar);
    border-right: 1px solid transparent; display: flex; flex-direction: column; overflow: hidden;
    transition: width 0.25s, min-width 0.25s, border-color 0.25s;
  }
  .material-panel.open { width: 340px; min-width: 340px; border-right-color: var(--border); }
  .mp-search-area { padding: 10px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .mp-search-row { display: flex; gap: 6px; margin-bottom: 6px; }
  .mp-search-row:last-child { margin-bottom: 0; }
  .mp-search-row input, .mp-search-row select {
    flex: 1; border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px;
    font: inherit; font-size: 13px; background: var(--bg-card); color: var(--text-primary); outline: none;
    transition: all 0.12s; min-width: 0;
  }
  .mp-search-row input:focus, .mp-search-row select:focus { border-color: var(--accent); }
  .mp-list { flex: 1; overflow-y: auto; padding: 8px; }
  .mp-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; margin-bottom: 8px; cursor: pointer; transition: all 0.12s;
  }
  .mp-card:hover { border-color: var(--accent); }
  .mp-card.expanded { border-color: var(--accent); }
  .mp-card .mp-card-title { font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 3px; }
  .mp-card .mp-card-body {
    font-size: 13px; color: var(--text-secondary); line-height: 1.7;
    max-height: 56px; overflow: hidden; margin-top: 6px; white-space: pre-wrap;
  }
  .mp-card.expanded .mp-card-body { max-height: none; }
  .mp-card .mp-expand-hint { font-size: 11px; color: var(--accent); margin-top: 4px; }
  .mp-empty { font-size: 12px; color: var(--text-muted); text-align: center; padding: 24px 12px; }

  /* ===== CHAPTER EDITOR MAIN ===== */
  .chapter-editor-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
  .content-editable {
    flex: 1; padding: 24px 28px; border: none; outline: none;
    font: inherit; font-size: 15px; line-height: 1.9; color: var(--text-primary);
    overflow-y: auto; background: var(--bg-card); word-break: break-word;
    -webkit-overflow-scrolling: touch; transition: background 0.3s, color 0.3s;
  }
  .content-editable:empty::before { content: "开始写这一章…"; color: var(--text-placeholder); }

  /* ===== BOOK HEADER ===== */
  .book-header-bar {
    display: flex; align-items: center; gap: 10px; padding: 10px 18px;
    background: var(--bg-card); border-bottom: 1px solid var(--border); flex-shrink: 0;
    transition: background 0.3s, border-color 0.3s;
  }
  .book-title-display { font-size: 14px; font-weight: 700; color: var(--text-primary); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .back-btn {
    border: none; background: none; font: inherit; font-size: 13px;
    color: var(--text-muted); cursor: pointer; padding: 4px 6px; border-radius: 4px; flex-shrink: 0;
  }
  .back-btn:hover { color: var(--accent); }
  .material-toggle-btn {
    position: relative;
  }
  .material-toggle-btn .badge {
    position: absolute; top: 2px; right: 2px;
    width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
  }

  /* ===== MODAL ===== */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: var(--bg-overlay);
    z-index: 200; align-items: center; justify-content: center; padding: 16px;
    transition: background 0.3s;
  }
  .modal-overlay.open { display: flex; }
  .toast {
    position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%) translateY(6px); background: rgba(15,23,42,.92); color: #fff;
    padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 500; opacity: 0;
    pointer-events: none; transition: opacity .25s, transform .25s; max-width: 82vw; text-align: center;
    -webkit-tap-highlight-color: transparent;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  /* ===== LOGIN ===== */
  .login-card { background: var(--bg-modal); border-radius: 16px; padding: 30px 24px; width: 340px; max-width: 90vw; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; gap: 12px; }
  .login-logo { text-align: center; font-size: 24px; font-weight: 800; color: var(--accent); letter-spacing: 0.05em; }
  .login-card h3 { text-align: center; margin: 2px 0 10px; font-size: 16px; color: var(--text-secondary); font-weight: 600; }
  .login-card input { width: 100%; border: 1px solid var(--border); border-radius: 9px; padding: 13px 14px; font: inherit; font-size: 16px; background: var(--bg-card); color: var(--text-primary); }
  .login-card input:focus { border-color: var(--accent); outline: none; }
  .auth-err { color: var(--warn); font-size: 13px; min-height: 18px; text-align: center; }
  .auth-switch { text-align: center; font-size: 13px; color: var(--accent); cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .user-badge { font-size: 12px; color: var(--text-muted); max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .modal {
    background: var(--bg-modal); border-radius: 10px; padding: 24px; width: 500px;
    max-width: 100%; max-height: 85vh; overflow-y: auto;
    box-shadow: var(--shadow-lg); transition: background 0.3s;
  }
  .modal h3 { font-size: 16px; margin-bottom: 18px; color: var(--text-primary); font-weight: 700; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: var(--text-secondary); margin-bottom: 5px; letter-spacing: 0.03em; }
  .field input, .field textarea, .field select {
    width: 100%; border: 1px solid var(--border); border-radius: 6px;
    padding: 9px 12px; font: inherit; font-size: 14px; color: var(--text-primary);
    background: var(--bg-card); outline: none; transition: all 0.12s;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
  .field textarea { min-height: 80px; resize: vertical; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  .color-presets { display: flex; gap: 6px; flex-wrap: wrap; }
  .color-preset {
    width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent;
    cursor: pointer; transition: all 0.12s;
  }
  .color-preset:active { transform: scale(1.15); }
  .color-preset.selected { border-color: var(--text-primary); box-shadow: 0 0 0 2px var(--bg-card), 0 0 0 4px var(--text-primary); }
  .insert-options { display: flex; flex-direction: column; gap: 6px; }
  .insert-option {
    border: 1px solid var(--border); background: var(--bg-card); border-radius: 8px;
    padding: 12px 16px; cursor: pointer; font: inherit; font-size: 14px; text-align: left;
    transition: all 0.12s; width: 100%;
  }
  .insert-option:hover { border-color: var(--accent); }
  .insert-option:active { background: var(--bg-hover); }
  .io-label { font-weight: 600; color: var(--text-primary); }
  .io-desc { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .source-note { font-size: 12px; color: var(--text-muted); font-style: italic; }

  /* ===== MOBILE BOTTOM BAR ===== */
  .mobile-bottom-bar {
    display: none; position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bg-card); border-top: 1px solid var(--border);
    z-index: 150; height: 56px; padding-bottom: var(--safe-bottom);
    box-shadow: 0 -1px 6px rgba(0,0,0,0.04); transition: background 0.3s, border-color 0.3s;
  }
  .mobile-bottom-bar .mb-inner { display: flex; height: 56px; align-items: stretch; }
  .mb-btn {
    flex: 1; border: none; background: none; font: inherit;
    font-size: 11px; color: var(--text-muted); cursor: pointer;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 3px; transition: color 0.12s; letter-spacing: 0.03em;
    -webkit-tap-highlight-color: transparent;
  }
  .mb-btn .mb-icon { font-size: 18px; line-height: 1; }
  .mb-btn.active { color: var(--accent); font-weight: 600; }

  /* Mobile overlays */
  .mobile-panel-overlay {
    display: none; position: fixed; inset: 0; top: 0; z-index: 160;
    background: var(--bg-card); flex-direction: column; overflow: hidden;
    transition: background 0.3s;
  }
  .mobile-panel-overlay.open { display: flex; }
  .mp-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    font-size: 15px; font-weight: 700; color: var(--text-primary); flex-shrink: 0;
  }
  .mp-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  /* ===== INSTALL HINT (PWA) ===== */
  .install-hint {
    display: none; position: fixed; left: 10px; right: 10px;
    bottom: calc(56px + var(--safe-bottom) + 10px);
    background: var(--accent); color: #fff; border-radius: 12px;
    padding: 10px 12px; font-size: 13px; line-height: 1.4; z-index: 180;
    box-shadow: var(--shadow-lg); align-items: center; gap: 8px; justify-content: space-between;
  }
  .install-hint.show { display: flex; }
  .install-hint .ih-text { flex: 1; }
  .install-hint .ih-close, .install-hint .ih-go {
    border: none; background: rgba(255,255,255,0.22); color: #fff;
    font: inherit; font-size: 12px; padding: 6px 10px; border-radius: 7px; cursor: pointer; flex-shrink: 0;
  }
  .install-hint .ih-go { background: #fff; color: var(--accent); font-weight: 700; }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 768px) {
    .top-nav { display: none; }
    .main-wrap { height: 100dvh; flex-direction: column; }
    .panel { flex-direction: column; }
    .sidebar { display: none; }
    .chapter-list-sidebar { display: none; }
    .mobile-bottom-bar { display: block; }
    .content-area { width: 100%; }
    .card-grid {
      grid-template-columns: 1fr; padding: 10px 12px 140px; gap: 8px;
    }
    .content-toolbar { flex-wrap: nowrap; overflow-x: auto; gap: 6px; }
    .content-toolbar .section-title { font-size: 13px; flex-shrink: 0; }
    .editor-container { width: 100%; }
    .editor-toolbar { padding: 6px 10px; gap: 1px; flex-wrap: nowrap; }
    .tool-btn { padding: 6px 10px; min-width: 34px; font-size: 14px; }
    .content-editable { padding: 16px 18px; font-size: 16px; line-height: 1.85; }
    .chapter-title-bar { padding: 10px 14px; }
    .chapter-title-bar input { font-size: 17px; }
    .writing-layout { flex-direction: column; }
    .outline-bar { padding: 8px 14px; font-size: 13px; }
    .outline-mid { max-height: 160px; }
    .outline-mid-body .outline-pane textarea { font-size: 13px; padding: 10px 14px; }
    .outline-full-body { flex-direction: column; }
    .outline-pane { border-right: none; border-bottom: 1px solid var(--border); }
    /* material panel on mobile: inline side-by-side, ~40% width */
    .material-panel {
      position: static; z-index: auto;
      width: 0; min-width: 0; border-right: none;
    }
    .material-panel.open { width: 40%; min-width: 40%; border-right-color: var(--border); }
    .mp-search-area { padding: 6px 8px; }
    .mp-search-row { flex-direction: column; gap: 4px; }
    .mp-search-row input, .mp-search-row select { font-size: 13px !important; padding: 6px 8px; }
    .mp-card { padding: 8px 10px; }
    .mp-card .mp-card-title { font-size: 12px; }
    .mp-card .mp-card-body { font-size: 11px; }
    .book-header-bar { padding: 8px 14px; }
    .book-header-bar .book-actions { display: flex; gap: 4px; margin-top: 4px; width: 100%; }
    .book-header-bar .book-actions .btn { font-size: 12px; padding: 5px 10px; }
    .chapter-meta { flex-wrap: wrap; gap: 6px; }
    .modal { width: 100%; max-width: 100%; border-radius: 14px 14px 0 0; margin-top: auto; max-height: 85vh; }
    .modal-overlay { align-items: flex-end; padding: 0; }
    .btn, .btn-sm, .chapter-add-btn, .chapter-item { min-height: 44px; display: flex; align-items: center; }
    .ms-btn { min-height: 36px; }
    .insert-option { min-height: 44px; }
    input:not(#chapter-title-input):not(.content-editable), select, textarea { font-size: 16px !important; }
    .desktop-only { display: none; }
    /* Android safe-area + native feel */
    .content-toolbar { padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
    .book-header-bar { padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
    .mp-header { padding-top: calc(14px + env(safe-area-inset-top, 0px)); }
    .outline-full-header { padding-top: calc(12px + env(safe-area-inset-top, 0px)); }
    .modal { padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
    .chapter-list-sidebar { padding-top: env(safe-area-inset-top, 0px); }
  }
</style>
</head>
<body>

<nav class="top-nav">
  <span class="logo">静 · 写字</span>
  <button class="tab-btn active" data-panel="materials">素材</button>
  <button class="tab-btn" data-panel="writing">写作</button>
  <button class="theme-toggle" id="theme-toggle" title="切换日间/夜间模式">
    <span class="toggle-icon">&#9788;</span> <span id="theme-label">日间</span>
  </button>
  <button class="theme-toggle" id="btn-backup" title="数据备份与恢复">&#128190; 备份</button>
  <span class="user-badge" id="user-badge" style="display:none;"></span>
</nav>

<div class="main-wrap">

<!-- ===== 素材面板 ===== -->
<div class="panel active" id="panel-materials">
  <aside class="sidebar" id="mat-sidebar">
    <div class="sidebar-header">
      标签
      <button class="btn-sm" style="width:auto;padding:4px 10px;" id="btn-add-tag">+ 新建</button>
    </div>
    <div class="tag-list" id="tag-list">
      <div class="tag-item all-tags selected" data-tag="all"><span class="tag-count" id="count-all">0</span> 全部</div>
    </div>
    <div class="sidebar-footer"><button class="btn-sm" id="btn-manage-tags">管理标签</button></div>
  </aside>
  <div class="content-area">
    <div class="content-toolbar">
      <span class="section-title">素材库</span>
      <select id="filter-type">
        <option value="all">全部类型</option>
        <option value="event">事件素材</option>
        <option value="full">全文素材</option>
        <option value="hook">导语模板</option>
        <option value="chapter">正文模板</option>
      </select>
      <button class="btn" id="btn-select-all" style="font-size:12px;">全选</button>
      <button class="btn" id="btn-export-selected" style="font-size:12px;">导出选中</button>
      <div class="spacer"></div>
      <button class="btn primary" id="btn-add-material">+ 新建素材</button>
    </div>
    <div class="card-grid" id="material-grid">
      <div class="empty-state"><span class="e-icon">&#9776;</span><p>还没有素材，点击 [+ 新建素材] 开始</p></div>
    </div>
  </div>
</div>

<!-- ===== 写作面板 ===== -->
<div class="panel" id="panel-writing">
  <aside class="sidebar" id="book-sidebar">
    <div class="sidebar-header">
      我的书
      <button class="btn-sm" style="width:auto;padding:4px 10px;" id="btn-add-book">+ 新建</button>
    </div>
    <div id="book-list" style="padding:0 8px;">
      <div class="empty-state" style="padding:24px 8px;"><span class="e-icon" style="font-size:28px;">&#128218;</span><p style="font-size:12px;">还没有书</p></div>
    </div>
  </aside>

  <div class="content-area" id="writing-main">
    <div id="writing-empty" class="empty-state">
      <span class="e-icon">&#9998;</span>
      <p>选择或新建一本书开始写作</p>
      <div id="writing-empty-booklist" style="width:100%;max-width:400px;text-align:left;padding:0 8px;"></div>
      <button class="btn primary" id="btn-add-book-mobile" style="margin-top:12px;display:none;">+ 新建书</button>
    </div>

    <div id="writing-editor" style="display:none;flex:1;flex-direction:column;overflow:hidden;">
      <!-- 书籍导航栏 -->
      <div class="book-header-bar">
        <button class="back-btn" id="btn-back-books">&larr; 返回书库</button>
        <span class="book-title-display" id="current-book-title"></span>
        <div class="book-actions">
          <button class="btn material-toggle-btn" id="btn-material-panel-toggle" style="font-size:12px;">素材</button>
          <button class="btn" id="btn-export-chapter" style="font-size:12px;">导出章节</button>
          <button class="btn" id="btn-rename-book" style="font-size:12px;">重命名</button>
          <button class="btn warn" id="btn-delete-book" style="font-size:12px;">删除</button>
        </div>
      </div>

      <div class="writing-layout">
        <!-- 章节列表 -->
        <div class="chapter-list-sidebar" id="chapter-sidebar">
          <div class="chapter-list-header">
            <span>章节</span>
          </div>
          <div id="chapter-list-items"></div>
          <button class="chapter-add-btn" id="btn-add-chapter">+ 添加章节</button>
        </div>

        <!-- 编辑器区域 -->
        <div class="editor-container" id="editor-container">
          <!-- 大纲区（始终显示，可折叠） -->
          <div class="outline-area open" id="outline-area">
            <div class="outline-bar" id="outline-bar">
              <span>大纲</span>
              <span class="outline-arrow">&#9660;</span>
            </div>
            <!-- 中等展开：旧大纲内容，可滑动 -->
            <div class="outline-mid" id="outline-mid">
              <div class="outline-mid-header">
                <span>大纲预览</span>
                <button class="btn" id="btn-outline-go-full" style="font-size:11px;padding:3px 8px;">全屏编辑</button>
              </div>
              <div class="outline-mid-body">
                <div class="outline-pane">
                  <div class="outline-pane-header">人物</div>
                  <textarea id="outline-characters-mid" placeholder="人物设定、性格、关系…"></textarea>
                </div>
                <div class="outline-pane">
                  <div class="outline-pane-header">故事情节</div>
                  <textarea id="outline-plot-mid" placeholder="情节发展、转折、高潮…"></textarea>
                </div>
              </div>
            </div>
          </div>

          <!-- 全展开：覆盖全屏 -->
          <div class="outline-backdrop" id="outline-backdrop"></div>
          <div class="outline-full" id="outline-full">
            <div class="outline-full-header">
              <span>大纲编辑</span>
              <button class="btn" id="btn-outline-collapse" style="font-size:12px;padding:4px 12px;">收起</button>
            </div>
            <div class="outline-full-body">
              <div class="outline-pane">
                <div class="outline-pane-header">人物</div>
                <textarea id="outline-characters" placeholder="人物设定、性格、关系…"></textarea>
              </div>
              <div class="outline-pane">
                <div class="outline-pane-header">故事情节</div>
                <textarea id="outline-plot" placeholder="情节发展、转折、高潮…"></textarea>
              </div>
            </div>
          </div>

          <!-- 编辑器工具栏 -->
          <div class="editor-toolbar" id="editor-toolbar">
            <button class="tool-btn" data-cmd="bold" title="加粗"><b>B</b></button>
            <button class="tool-btn" data-cmd="italic" title="斜体"><i>I</i></button>
            <button class="tool-btn" data-cmd="underline" title="下划线"><u>U</u></button>
            <span class="sep"></span>
            <button class="tool-btn">
              <select id="font-size-select">
                <option value="1">小</option>
                <option value="3" selected>中</option>
                <option value="5">大</option>
                <option value="7">特大</option>
              </select>
            </button>
            <span class="sep"></span>
            <button class="tool-btn color-wrap" title="字体颜色">
              <span style="text-decoration:underline;text-decoration-color:var(--text-secondary);">A</span>
              <input type="color" class="color-input" id="font-color-picker" value="#1e293b">
            </button>
            <span class="sep desktop-only"></span>
            <button class="tool-btn" data-cmd="insertUnorderedList">&#8226; 列表</button>
            <button class="tool-btn" data-cmd="insertOrderedList">1. 列表</button>
            <div class="spacer" style="min-width:4px;"></div>
            <span class="chapter-meta">
              <span id="chapter-word-count">0 字</span>
              <span class="desktop-only" id="chapter-timer">&#9201; 0分0秒</span>
              <span class="desktop-only" id="chapter-date">-</span>
            </span>
          </div>

          <!-- 章节标题 -->
          <div class="chapter-title-bar">
            <input id="chapter-title-input" placeholder="章节标题">
            <div class="chapter-meta"><span class="desktop-only" id="chapter-word-count2">0 字</span></div>
          </div>

          <!-- 正文 + 素材面板（原始结构） -->
          <div class="chapter-editor-wrap" id="chapter-editor-wrap">
            <!-- 素材面板（左侧，可滑出） -->
            <div class="material-panel" id="material-panel">
              <div class="mp-search-area">
                <div class="mp-search-row">
                  <input type="text" id="mp-search-text" placeholder="搜索素材…">
                </div>
                <div class="mp-search-row">
                  <select id="mp-filter-tag">
                    <option value="all">全部标签</option>
                  </select>
                  <select id="mp-filter-type">
                    <option value="all">全部类型</option>
                    <option value="event">事件素材</option>
                    <option value="full">全文素材</option>
                    <option value="hook">导语模板</option>
                    <option value="chapter">正文模板</option>
                  </select>
                </div>
              </div>
              <div class="mp-list" id="mp-list">
                <div class="mp-empty">输入关键词或选择标签搜索素材</div>
              </div>
            </div>

            <!-- 正文编辑区 -->
            <div class="chapter-editor-main" id="chapter-editor-main">
              <div class="content-editable" id="content-editable" contenteditable="true"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

</div>

<!-- ===== 手机底部栏 ===== -->
<div class="mobile-bottom-bar" id="mobile-bar">
  <div class="mb-inner">
    <button class="mb-btn active" data-mb="materials"><span class="mb-icon">&#9776;</span> 素材</button>

<div class="mobile-panel-overlay" id="mp-tags">

// ==== SYNC KEY（登录后按账号隔离：users/<uid>）====
let SYNC_PATH = 'shared';

// ==== DATA ====
const STORE = {
  tags: JSON.parse(localStorage.getItem('jw-tags') || '[]'),
  materials: JSON.parse(localStorage.getItem('jw-materials') || '[]'),
  books: JSON.parse(localStorage.getItem('jw-books') || '[]'),
  outlines: JSON.parse(localStorage.getItem('jw-outlines') || '{}'),
  outline_characters: JSON.parse(localStorage.getItem('jw-outline-chars') || '{}'),
  outline_plot: JSON.parse(localStorage.getItem('jw-outline-plot') || '{}'),
};
function save(k) {
  if (!k || k === 'tags')    localStorage.setItem('jw-tags',     JSON.stringify(STORE.tags));
  if (!k || k === 'materials') localStorage.setItem('jw-materials', JSON.stringify(STORE.materials));
  if (!k || k === 'books')   localStorage.setItem('jw-books',    JSON.stringify(STORE.books));
  if (!k || k === 'outlines') localStorage.setItem('jw-outlines', JSON.stringify(STORE.outlines));
  if (typeof STORE.outline_characters !== 'undefined') localStorage.setItem('jw-outline-chars', JSON.stringify(STORE.outline_characters));
  if (typeof STORE.outline_plot !== 'undefined') localStorage.setItem('jw-outline-plot', JSON.stringify(STORE.outline_plot));
  // 同步到云端
  pushToCloud(k);
}

let _syncTimer = null;
function pushToCloud(k) {
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(() => {
    const data = {};
    if (!k || k === 'tags')    data.tags      = STORE.tags;
    if (!k || k === 'materials') data.materials = STORE.materials;
    if (!k || k === 'books')   data.books     = STORE.books;
    if (!k || k === 'outlines') data.outlines  = STORE.outlines;
    db.ref(SYNC_PATH).update(data).catch(() => {});
    // 也保存章节内容
    if ((!k || k === 'books') && STORE.books.length > 0) {
      const chapters = {};
      STORE.books.forEach(b => {
        (b.chapters||[]).forEach(ch => {
          const content = localStorage.getItem('jw-ch-' + ch.id);
          if (content) chapters[ch.id] = content;
        });
      });
      if (Object.keys(chapters).length > 0) {
        db.ref(SYNC_PATH + '/chapters').update(chapters).catch(() => {});
      }
    }
  }, 300);
}

// ==== 从云端拉取数据 ====
function pullFromCloud() {
  return db.ref(SYNC_PATH).once('value').then(snap => {
    const d = snap.val() || {};
    // 比较时间戳，本地和云端谁新用谁
    const localVer = parseInt(localStorage.getItem('jw-version') || '0');
    const cloudVer = d._version || 0;
    if (cloudVer > localVer) {
      if (d.tags)     { STORE.tags     = d.tags;     localStorage.setItem('jw-tags',     JSON.stringify(d.tags)); }
      if (d.materials) { STORE.materials = d.materials; localStorage.setItem('jw-materials', JSON.stringify(d.materials)); }
      if (d.books)    { STORE.books    = d.books;    localStorage.setItem('jw-books',    JSON.stringify(d.books)); }
      if (d.outlines) { STORE.outlines = d.outlines; localStorage.setItem('jw-outlines', JSON.stringify(d.outlines)); }
      if (d.chapters) {
        Object.keys(d.chapters).forEach(k => { localStorage.setItem('jw-ch-' + k, d.chapters[k]); });
      }
      if (cloudVer > 0) localStorage.setItem('jw-version', String(cloudVer));
    }
    // 更新版本号
    const newVer = Math.max(localVer, cloudVer) + 1;
    db.ref(SYNC_PATH + '/_version').transaction(cur => {
      return Math.max(cur || 0, newVer);
    }).catch(() => {});
    localStorage.setItem('jw-version', String(newVer));
  }).catch(() => {});
}

  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('jw-theme', theme);
  $('#theme-label').textContent = theme === 'dark' ? '夜间' : '日间';
  $('#theme-toggle').querySelector('.toggle-icon').innerHTML = theme === 'dark' ? '&#9790;' : '&#9788;';
  const mbIcon = $('#mb-theme-icon');
  if (mbIcon) { mbIcon.innerHTML = theme === 'dark' ? '&#9788;' : '&#9790;'; }
  const mbBtn = $('#mb-theme-toggle');
  if (mbBtn) { mbBtn.querySelector('span:last-child').textContent = theme === 'dark' ? '日间' : '夜间'; }
}
$('#theme-toggle').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  setTheme(cur === 'dark' ? 'light' : 'dark');
});
$('#mb-theme-toggle').addEventListener('click', () => {

});

// ==== HELPERS ====
function $(s) { return document.querySelector(s); }
function $$(s) { return document.querySelectorAll(s); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmtDate(ts) { const d = new Date(ts); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function escHtml(s) { const el = document.createElement('span'); el.textContent = s || ''; return el.innerHTML; }
function isMobile() { return window.innerWidth <= 768; }
function typeLabel(t) { return {event:'事件素材',full:'全文素材',hook:'导语模板',chapter:'正文模板'}[t]||'事件素材'; }
function wc(text) {
  if (!text) return 0;
  text = String(text).replace(/<[^>]*>/g, '');
  return (text.match(/[一-鿿]/g) || []).length + text.replace(/[一-鿿]/g, '').trim().split(/\s+/).filter(Boolean).length;
}
const TAG_COLORS = ['#3b82f6','#6366f1','#8b5cf6','#ec4899','#f43f5e','#f97316','#eab308','#22c55e','#14b8a6','#06b6d4','#64748b','#475569','#78716c','#a855f7','#ef4444'];

let activeTagFilter = 'all';
let activeTypeFilter = 'all';
let currentBookId = null;
let currentChapterId = null;

function openModal(title, bodyHtml, onSave) {
  $('#modal-container').innerHTML = `<h3>${title}</h3>${bodyHtml}<div class="modal-actions"><button class="btn" id="modal-cancel">取消</button><button class="btn primary" id="modal-save">保存</button></div>`;
  $('#modal-overlay').classList.add('open');
  $('#modal-cancel').onclick = () => $('#modal-overlay').classList.remove('open');
  $('#modal-save').onclick = () => { const r = onSave(); if (r !== false) $('#modal-overlay').classList.remove('open'); };
  $('#modal-overlay').onclick = function(e) { if (e.target === this) this.classList.remove('open'); };
}
function closeModal() { $('#modal-overlay').classList.remove('open'); }

// ==== 轻提示 ====
let _toastTimer = null;
function toast(msg) {
  const t = $('#toast'); if (!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 2400);

// ==== 数据备份 / 恢复 ====
function buildBackup() {
  const data = {
    tags: STORE.tags,
    materials: STORE.materials,
    books: STORE.books,
    outlines: STORE.outlines,
    outline_characters: STORE.outline_characters,
    outline_plot: STORE.outline_plot,
    chapters: {},
    version: parseInt(localStorage.getItem('jw-version') || '0', 10)
  };
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.indexOf('jw-ch-') === 0) data.chapters[k.substring(6)] = localStorage.getItem(k);
  }
  return { _app: '静·写字', _backupVersion: 1, _backupAt: new Date().toISOString(), data };
}
function exportBackup() {
  const payload = buildBackup();
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date(), p = n => String(n).padStart(2, '0');
  a.href = url;
  a.download = `jing-write-backup-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  closeBackupModal();
  toast('备份已导出到下载文件夹 ✦');
}
function importBackup(file) {
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const payload = JSON.parse(e.target.result);
      const d = payload.data || payload;
      if (!confirm('恢复会用备份覆盖当前全部素材、书籍与章节内容（并同步到云端）。确定继续？')) return;
      for (let i = localStorage.length - 1; i >= 0; i--) {
        const k = localStorage.key(i);
        if (k && k.indexOf('jw-ch-') === 0) localStorage.removeItem(k);
      }
      STORE.tags = d.tags || [];
      STORE.materials = d.materials || [];
      STORE.books = d.books || [];
      STORE.outlines = d.outlines || {};
      STORE.outline_characters = d.outline_characters || {};
      STORE.outline_plot = d.outline_plot || {};
      if (d.chapters) Object.keys(d.chapters).forEach(id => localStorage.setItem('jw-ch-' + id, d.chapters[id]));
      if (d.version) localStorage.setItem('jw-version', String(d.version));
      localStorage.setItem('jw-tags', JSON.stringify(STORE.tags));
      localStorage.setItem('jw-materials', JSON.stringify(STORE.materials));
      localStorage.setItem('jw-books', JSON.stringify(STORE.books));
      localStorage.setItem('jw-outlines', JSON.stringify(STORE.outlines));
      localStorage.setItem('jw-outline-chars', JSON.stringify(STORE.outline_characters));
      localStorage.setItem('jw-outline-plot', JSON.stringify(STORE.outline_plot));
      save();
      toast('恢复完成，正在重新加载…');
      setTimeout(() => location.reload(), 700);
    } catch (err) { alert('备份文件解析失败：' + err.message); }
  };
  reader.readAsText(file);
}
function openBackupModal() { $('#backup-modal') && $('#backup-modal').classList.add('open'); }
function closeBackupModal() { $('#backup-modal') && $('#backup-modal').classList.remove('open'); }
function wireBackup() {
  $('#btn-backup') && $('#btn-backup').addEventListener('click', openBackupModal);
  $('#mb-backup') && $('#mb-backup').addEventListener('click', openBackupModal);
  $('#bk-close') && $('#bk-close').addEventListener('click', closeBackupModal);
  $('#bk-export') && $('#bk-export').addEventListener('click', exportBackup);
  $('#bk-import') && $('#bk-import').addEventListener('click', () => { const f = $('#bk-file'); if (f) f.click(); });
  $('#bk-file') && $('#bk-file').addEventListener('change', function() { if (this.files && this.files[0]) importBackup(this.files[0]); this.value = ''; });
  $('#backup-modal') && ($('#backup-modal').onclick = function(e) { if (e.target === this) closeBackupModal(); });
}
wireBackup();

// ==== MATERIALS ====
function refreshMaterials() { renderTagList(); renderMaterialCards(); }

function renderTagList() {
  const build = (c) => {
    c.innerHTML = `<div class="tag-item all-tags ${activeTagFilter==='all'?'selected':''}" data-tag="all"><span class="tag-count">${STORE.materials.length}</span> 全部</div>`;
    STORE.tags.forEach(t => {
      const cnt = STORE.materials.filter(m => (m.tagIds||[]).includes(t.id)).length;
      c.insertAdjacentHTML('beforeend', `<div class="tag-item ${activeTagFilter===t.id?'selected':''}" data-tag="${t.id}"><span class="tag-dot" style="background:${t.color}"></span>${escHtml(t.name)}<span class="tag-count">${cnt}</span></div>`);
    });
    c.querySelectorAll('.tag-item').forEach(el => { el.addEventListener('click', () => { activeTagFilter = el.dataset.tag; renderTagList(); renderMaterialCards(); }); });
  };
  build($('#tag-list'));
  if (isMobile()) build($('#mp-tags-body'));
}

function renderMaterialCards() {
  const grid = $('#material-grid');
  let mats = [...STORE.materials];
  if (activeTagFilter !== 'all') mats = mats.filter(m => (m.tagIds||[]).includes(activeTagFilter));
  if (activeTypeFilter !== 'all') mats = mats.filter(m => m.type === activeTypeFilter);
  if (mats.length === 0) {
    grid.innerHTML = '<div class="empty-state"><span class="e-icon">&#9776;</span><p>还没有素材，点击 [+ 新建素材] 开始</p></div>'; return;
  }
  grid.innerHTML = mats.map(m => `
    <div class="material-card" data-id="${m.id}">
      <div class="card-check" style="position:absolute;top:8px;right:10px;z-index:1;">
        <input type="checkbox" class="mat-checkbox" data-mid="${m.id}" style="width:18px;height:18px;cursor:pointer;accent-color:var(--accent);" onclick="event.stopPropagation();">
      </div>
      <span class="card-type ${m.type||'event'}">${typeLabel(m.type)}</span>
      <div class="card-title">${escHtml(m.title)||'无标题'}</div>
      <div class="card-body">${escHtml((m.content||'').slice(0,120))}</div>
      ${m.content && m.content.length > 120 ? '<div class="card-hover-preview">' + escHtml(m.content) + '</div>' : ''}
      <div class="card-tags">${(m.tagIds||[]).map(tid => { const t = STORE.tags.find(x => x.id === tid); return t ? `<span class="mini-tag" style="background:${t.color}">${escHtml(t.name)}</span>` : ''; }).join('')}</div>
      <div class="card-meta"><span>${fmtDate(m.createdAt)}</span>${m.sourceNote?('<span class="source-note">来源: '+escHtml(m.sourceNote)+'</span>'):''}</div>
    </div>
  `).join('');
  grid.querySelectorAll('.material-card').forEach(card => {
    card.addEventListener('click', (e) => {
      if (e.target.closest('input')) return;
      editMaterial(card.dataset.id);
    });
    card.style.position = 'relative';
  });
}

  setTimeout(() => { $$('#color-presets .color-preset').forEach(el => { el.addEventListener('click', () => { $$('#color-presets .color-preset').forEach(x => x.classList.remove('selected')); el.classList.add('selected'); }); }); }, 50);

function showManageTags() {
  const list = STORE.tags.map(t => `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;padding:10px;background:var(--bg-hover);border-radius:6px;"><span class="tag-dot" style="background:${t.color}"></span><span style="flex:1;font-size:13px;">${escHtml(t.name)}</span><button class="btn warn" style="font-size:11px;padding:3px 8px;" data-tdel="${t.id}">删除</button></div>`).join('') || '<p style="font-size:13px;color:var(--text-muted);">暂无标签</p>';
  openModal('管理标签', list, true);
  setTimeout(() => { $$('#modal-container [data-tdel]').forEach(b => b.addEventListener('click', () => { STORE.tags = STORE.tags.filter(t => t.id !== b.dataset.tdel); STORE.materials.forEach(m => { m.tagIds = (m.tagIds||[]).filter(id => id !== b.dataset.tdel); }); save('tags'); save('materials'); closeModal(); refreshMaterials(); })); }, 50);

// ==== MATERIAL CRUD ====
$('#btn-add-material').addEventListener('click', () => {
  const defaultType = activeTypeFilter !== 'all' ? activeTypeFilter : 'event';
  openMaterialEditor(null, defaultType);
});
$('#btn-add-tag').addEventListener('click', showAddTag);
$('#btn-manage-tags').addEventListener('click', showManageTags);
function openMaterialEditor(existing, defaultType) {
  const isEdit = !!existing;
  const m = existing || { id: uid(), title:'', content:'', type: defaultType || 'event', tagIds:[], sourceNote:'', createdAt:Date.now() };
  const tpl = STORE.tags.map(t => `<label style="display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:13px;cursor:pointer;"><input type="checkbox" value="${t.id}" ${(m.tagIds||[]).includes(t.id)?'checked':''}><span class="tag-dot" style="background:${t.color}"></span>${escHtml(t.name)}</label>`).join('') || '<span style="font-size:12px;color:var(--text-muted);">暂无标签</span>';
  openModal(isEdit?'编辑素材':'新建素材', `
    <div class="field"><label>标题</label><input id="mat-title" value="${escHtml(m.title)}" placeholder="素材标题"></div>
    <div class="field"><label>类型</label><select id="mat-type">
      <option value="event" ${m.type==='event'?'selected':''}>事件素材</option>
      <option value="full" ${m.type==='full'?'selected':''}>全文素材</option>
      <option value="hook" ${m.type==='hook'?'selected':''}>导语模板</option>
      <option value="chapter" ${m.type==='chapter'?'selected':''}>正文模板</option>
    </select></div>
    <div class="field"><label>标签</label><div id="mat-tags">${tpl}</div></div>
    <div class="field"><label>正文（支持大量文字，可自由输入）</label><textarea id="mat-content" placeholder="素材内容…" style="min-height:400px;font-size:14px;line-height:1.8;">${escHtml(m.content)}</textarea></div>
    <div class="field"><label>来源备注</label><input id="mat-source" value="${escHtml(m.sourceNote)}" placeholder="来源链接或备注"></div>
    ${isEdit?'<div class="field"><button class="btn warn" id="mat-delete">删除此素材</button></div>':''}
  `, () => {
    m.title = $('#mat-title').value.trim(); m.type = $('#mat-type').value;
    m.content = $('#mat-content').value; m.sourceNote = $('#mat-source').value.trim();
    m.tagIds = [...$$('#mat-tags input:checked')].map(cb => cb.value);
    if (!isEdit) { m.createdAt = Date.now(); STORE.materials.unshift(m); }
    else { const idx = STORE.materials.findIndex(x => x.id === m.id); if (idx >= 0) STORE.materials[idx] = m; }
    save('materials'); refreshMaterials();
  });
  setTimeout(() => { const db = $('#mat-delete'); if (db) db.addEventListener('click', () => { if (confirm('确定删除？')) { STORE.materials = STORE.materials.filter(x => x.id !== m.id); save('materials'); closeModal(); refreshMaterials(); } }); }, 50);
}
function editMaterial(id) { const m = STORE.materials.find(x => x.id === id); if (m) openMaterialEditor(m); }
$('#filter-type').addEventListener('change', function() { activeTypeFilter = this.value; renderMaterialCards(); });

// ==== EXPORT: select all / export selected ====
$('#btn-select-all').addEventListener('click', () => {
  const cbs = $$('.mat-checkbox');
  if (cbs.length === 0) return;
  const allChecked = [...cbs].every(cb => cb.checked);
  cbs.forEach(cb => { cb.checked = !allChecked; });
  $('#btn-select-all').textContent = allChecked ? '全选' : '取消全选';
});
$('#btn-export-selected').addEventListener('click', () => {
  const ids = [...$$('.mat-checkbox:checked')].map(cb => cb.dataset.mid);
  if (ids.length === 0) { alert('请先勾选要导出的素材'); return; }
  const mats = STORE.materials.filter(m => ids.includes(m.id));
  exportToWord(mats);
});

// ==== WORD EXPORT ====
function exportToWord(items) {
  if (!items || items.length === 0) return;
  const isSingle = items.length === 1;
  const title = isSingle ? (items[0].title || '未命名') : '素材导出';
  let body = '';
  items.forEach((m, i) => {
    if (items.length > 1) body += `<h2 style="margin-top:${i>0?'30px':'0'};">${i+1}. ${escHtml(m.title) || '无标题'}</h2>`;
    body += `<p style="color:#666;font-size:12px;margin-bottom:4px;">${typeLabel(m.type)} &nbsp; ${fmtDate(m.createdAt)}`;
    if (m.sourceNote) body += ` &nbsp; 来源: ${escHtml(m.sourceNote)}`;
    const tagNames = (m.tagIds||[]).map(tid => { const t = STORE.tags.find(x => x.id === tid); return t ? t.name : ''; }).filter(Boolean);
    if (tagNames.length) body += ` &nbsp; 标签: ${tagNames.join(', ')}`;
    body += `</p><div style="line-height:1.8;font-size:14px;margin-top:8px;">${(m.content||'').replace(/\n/g,'<br>')}</div>`;
  });
  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${title}</title><style>body{font-family:'Microsoft YaHei','微软雅黑',sans-serif;max-width:720px;margin:40px auto;padding:20px;color:#1a202c;}h2{font-size:18px;margin-bottom:8px;}h1{font-size:22px;border-bottom:2px solid #3b82f6;padding-bottom:10px;margin-bottom:24px;}</style></head><body><h1>${isSingle ? (items[0].title||'未命名') : '素材导出'}</h1>${body}</body></html>`;

function renderChapterList() {
  const book = getBook(); if (!book) return;
  const chapters = book.chapters || [];
  const build = (container) => {
    container.innerHTML = chapters.map((ch, i) => `
      <div class="chapter-item ${currentChapterId===ch.id?'active':''}" data-chid="${ch.id}" draggable="true">
        <span class="drag-handle">&equiv;</span>
        <span class="chapter-index">${i+1}.</span>
        <span class="chapter-name">${escHtml(ch.title)||'未命名'}</span>
        <button class="ch-del" data-chdel="${ch.id}" style="opacity:0;background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:13px;padding:0 4px;">&times;</button>
      </div>`).join('');
    container.querySelectorAll('.chapter-item').forEach(el => {
      el.addEventListener('click', function(e) { if (e.target.closest('.ch-del') || e.target.closest('.drag-handle')) return; openChapter(el.dataset.chid); if (isMobile()) updateMobileBar('writer'); });
    });
    container.querySelectorAll('.ch-del').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.stopPropagation(); if (!confirm('删除这一章？')) return;
        if (currentChapterId === btn.dataset.chdel) { stopTimer(); clearEditor(); currentChapterId = null; }
        book.chapters = chapters.filter(c => c.id !== btn.dataset.chdel);
        localStorage.removeItem('jw-ch-' + btn.dataset.chdel); save('books'); renderChapterList();
        if (book.chapters.length > 0) openChapter(book.chapters[0].id);
      });
    });
    container.querySelectorAll('.chapter-item').forEach(el => {
      el.addEventListener('mouseenter', function(){ this.querySelector('.ch-del').style.opacity='1'; });
      el.addEventListener('mouseleave', function(){ this.querySelector('.ch-del').style.opacity=''; });
    });
    setupDrag(container);
  };
  build($('#chapter-list-items'));
  if (isMobile()) build($('#mp-chapters-body'));
}
function setupDrag(container) {
  let dragged = null;
  container.querySelectorAll('.chapter-item').forEach(el => {
    el.addEventListener('dragstart', function(e) { dragged = this; this.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
    el.addEventListener('dragend', function() { this.classList.remove('dragging'); });
    el.addEventListener('dragover', function(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; this.classList.add('drag-over'); });
    el.addEventListener('dragleave', function() { this.classList.remove('drag-over'); });
    el.addEventListener('drop', function(e) {
      e.preventDefault(); this.classList.remove('drag-over'); if (dragged === this) return;
      const b = getBook(); if (!b) return;
      const fi = b.chapters.findIndex(c => c.id === dragged.dataset.chid);
      const ti = b.chapters.findIndex(c => c.id === this.dataset.chid);
      if (fi < 0 || ti < 0) return;
      const [mv] = b.chapters.splice(fi, 1); b.chapters.splice(ti, 0, mv);
      save('books'); renderChapterList();
    });
  });
}

// ==== TIMER ====
function startTimer() {
  stopTimer();
  timerState.bookId = currentBookId; timerState.chapterId = currentChapterId;
  timerState.startedAt = Date.now(); timerState.accumulated = 0;
  const b = getBook(); if (b) { const ch = (b.chapters||[]).find(c => c.id === currentChapterId); if (ch && ch.writingTime) timerState.accumulated = ch.writingTime; }
  saveTimerState();
  timerInterval = setInterval(() => {
    const elapsed = timerState.accumulated + Math.floor((Date.now() - timerState.startedAt) / 1000);
    $('#chapter-timer').textContent = Math.floor(elapsed/60) + '分' + (elapsed%60) + '秒';
  }, 1000);
}
function stopTimer() {
  if (timerInterval) {
    clearInterval(timerInterval); timerInterval = null;
    if (timerState.startedAt && currentChapterId) {
      const elapsed = Math.floor((Date.now() - timerState.startedAt) / 1000);
      const b = getBook(); if (b) { const ch = (b.chapters||[]).find(c => c.id === currentChapterId); if (ch) { ch.writingTime = (ch.writingTime||0) + elapsed; save('books'); } }
    }
    timerState.startedAt = null; timerState.accumulated = 0; saveTimerState();
  }
  $('#chapter-timer').textContent = '0分0秒';
}

function toggleMaterialPanel() {

function refreshMaterialPanel() {
  // update tag filter options
  const tagSelect = $('#mp-filter-tag');
  tagSelect.innerHTML = '<option value="all">全部标签</option>' +
    STORE.tags.map(t => `<option value="${t.id}">${escHtml(t.name)}</option>`).join('');

  const searchText = ($('#mp-search-text').value || '').toLowerCase().trim();
  const filterTag = $('#mp-filter-tag').value;
  const filterType = $('#mp-filter-type').value;

  let mats = [...STORE.materials];
  if (filterTag !== 'all') mats = mats.filter(m => (m.tagIds||[]).includes(filterTag));
  if (filterType !== 'all') mats = mats.filter(m => m.type === filterType);
  if (searchText) {
    mats = mats.filter(m =>
      (m.title||'').toLowerCase().includes(searchText) ||
      (m.content||'').toLowerCase().includes(searchText)
    );
  }

  const list = $('#mp-list');
  if (mats.length === 0) {
    list.innerHTML = '<div class="mp-empty">没有匹配的素材</div>'; return;
  }
  list.innerHTML = mats.map(m => {
    const tags = (m.tagIds||[]).map(tid => { const t = STORE.tags.find(x => x.id === tid); return t ? `<span class="mini-tag" style="background:${t.color}">${escHtml(t.name)}</span>` : ''; }).join('');
    const preview = escHtml((m.content||'').slice(0, 80));
    const hasMore = (m.content||'').length > 80;
    return `<div class="mp-card" data-mpid="${m.id}">
      <span class="card-type ${m.type||'event'}" style="font-size:10px;">${typeLabel(m.type)}</span>
      <div class="mp-card-title">${escHtml(m.title)||'无标题'}</div>
      <div class="card-tags" style="margin-top:3px;">${tags}</div>
      <div class="mp-card-body">${preview}${hasMore?'…':''}</div>
      ${hasMore ? '<div class="mp-expand-hint">点击展开查看全文</div>' : ''}
    </div>`;
  }).join('');

  // click to expand/collapse
  list.querySelectorAll('.mp-card').forEach(card => {
    card.addEventListener('click', function(e) {
      const m = STORE.materials.find(x => x.id === card.dataset.mpid);
      if (m && (m.content||'').length > 80) {
        if (card.classList.contains('expanded')) {
          card.classList.remove('expanded');
          card.querySelector('.mp-card-body').textContent = escHtml((m.content||'').slice(0, 80)) + '…';
          const hint = card.querySelector('.mp-expand-hint');
          if (hint) hint.textContent = '点击展开查看全文';
        } else {
          card.classList.add('expanded');
          card.querySelector('.mp-card-body').textContent = m.content || '';
          const hint = card.querySelector('.mp-expand-hint');
          if (hint) hint.textContent = '点击收起';
        }
      }
    });
  });
}

function showLogin() { const o = $('#login-overlay'); if (o) o.classList.add('open'); }
function hideLogin() { const o = $('#login-overlay'); if (o) o.classList.remove('open'); }
let _authMode = 'login';
function setAuthMode(m) {
  _authMode = m;
  $('#auth-title').textContent = m === 'login' ? '登录「静 · 写字」' : '注册「静 · 写字」';
  $('#auth-submit').textContent = m === 'login' ? '登录' : '注册';
  $('#auth-switch').textContent = m === 'login' ? '没有账号？去注册' : '已有账号？去登录';
}
function authErrorMsg(err) {
  const c = err && err.code;
  if (c === 'auth/invalid-email') return '邮箱格式不正确';
  if (c === 'auth/weak-password') return '密码至少 6 位';
  if (c === 'auth/user-not-found' || c === 'auth/wrong-password' || c === 'auth/invalid-credential') return '邮箱或密码不正确';
  if (c === 'auth/email-already-in-use') return '该邮箱已注册，请直接登录';
  if (c === 'auth/network-request-failed') return '网络异常，请检查网络';
  if (c === 'auth/too-many-requests') return '尝试次数过多，请稍后再试';
  return (err && err.message) ? err.message : '出错了，请重试';
}
function doAuth() {
  const email = $('#auth-email').value.trim();
  const pw = $('#auth-pw').value;
  if (!email || !pw) { $('#auth-err').textContent = '请输入邮箱和密码'; return; }
  $('#auth-err').textContent = '';
  const btn = $('#auth-submit'); btn.disabled = true;
  const p = _authMode === 'login'
    ? auth.signInWithEmailAndPassword(email, pw)
    : auth.createUserWithEmailAndPassword(email, pw);
  p.then(() => { /* onAuthStateChanged 会接管界面 */ })
   .catch(err => { $('#auth-err').textContent = authErrorMsg(err); btn.disabled = false; });
}
function logout() {
  auth.signOut().then(() => {
    ['jw-tags','jw-materials','jw-books','jw-outlines','jw-outline-chars','jw-outline-plot','jw-version'].forEach(k => localStorage.removeItem(k));
    for (let i = localStorage.length - 1; i >= 0; i--) { const k = localStorage.key(i); if (k && k.indexOf('jw-ch-') === 0) localStorage.removeItem(k); }
    location.reload();
  });
}
function updateUserBadge(user) {
  const el = $('#user-badge');
  if (!el) return;
  el.textContent = (user.email || '已登录').split('@')[0];
  el.style.display = '';
}
$('#auth-submit').addEventListener('click', doAuth);
$('#auth-switch').addEventListener('click', () => setAuthMode(_authMode === 'login' ? 'register' : 'login'));
$('#auth-email').addEventListener('keydown', e => { if (e.key === 'Enter') doAuth(); });
$('#auth-pw').addEventListener('keydown', e => { if (e.key === 'Enter') doAuth(); });
$('#bk-logout').addEventListener('click', () => { closeBackupModal(); logout(); });

// 登录状态门控：未登录只显示登录框，数据按账号隔离
auth.onAuthStateChanged(function(user) {
  if (user) {
    SYNC_PATH = 'users/' + user.uid;
    hideLogin();
    updateUserBadge(user);
    if (!_appStarted) { _appStarted = true; startApp(); }
  } else {
    SYNC_PATH = 'shared';
    showLogin();
  }
});
setAuthMode('login');
</script>

<script>
/* ===== PWA: inline manifest (single-file hosting friendly) ===== */
(function(){
  try {
    var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='512' height='512'><rect width='512' height='512' rx='112' fill='#3b82f6'/><text x='50%' y='56%' font-size='300' fill='#ffffff' text-anchor='middle' dominant-baseline='middle' font-family='Microsoft YaHei,sans-serif' font-weight='700'>静</text></svg>";
    var iconUrl = 'data:image/svg+xml,' + encodeURIComponent(svg);
    var manifest = {
      name: '静 · 写字', short_name: '静·写字',
      description: '一个安静的写字与素材管理工具',
      start_url: '.', scope: '.',
      display: 'standalone', display_override: ['standalone','fullscreen'],
      orientation: 'portrait',
      background_color: '#f4f6f9', theme_color: '#3b82f6',
      icons: [ { src: iconUrl, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' } ]
    };
    var link = document.getElementById('app-manifest');
    if (link) link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'}));
    var ati = document.createElement('link'); ati.rel = 'apple-touch-icon'; ati.href = iconUrl; document.head.appendChild(ati);
  } catch(e) {}
})();

/* ===== PWA install hint (Android) ===== */
(function(){
  var hint = document.getElementById('install-hint');
  if (!hint) return;
  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  var dismissed = localStorage.getItem('jw-install-hint') === '1';
  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferredPrompt = e; });
  function showHint(){ if (!isAndroid || isStandalone || dismissed) return; hint.classList.add('show'); }
  document.getElementById('ih-close').addEventListener('click', function(){
    hint.classList.remove('show'); localStorage.setItem('jw-install-hint','1');
  });
  document.getElementById('ih-go').addEventListener('click', function(){
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function(){ deferredPrompt = null; hint.classList.remove('show'); localStorage.setItem('jw-install-hint','1'); });
    } else {
      hint.querySelector('.ih-text').textContent = '点浏览器菜单（⋮）→「添加到主屏幕」即可像 App 一样用 ✦';
    }
  });
  setTimeout(showHint, 1500);
})();
</script>
